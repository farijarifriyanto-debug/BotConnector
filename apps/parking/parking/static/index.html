<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotConnector Parking — Pusat Operasional Parkir</title>
<!-- BotConnector AI Support Widget Styles -->
<link rel="stylesheet" href="/static/css/support_ai_widget.css">
<style>
:root {
  --bg: #F8FAFC;
  --card: #FFFFFF;
  --ink: #0B1020;
  --ink2: #1E293B;
  --muted: #64748B;
  --border: #E2E8F0;
  --border-focus: #5B5FEF;
  --accent: #5B5FEF;
  --accent-hover: #484CD9;
  --accent-bg: #EEF0FF;
  --ok: #16A34A;
  --ok-bg: #DCFCE7;
  --warn: #D97706;
  --warn-bg: #FEF3C7;
  --crit: #DC2626;
  --crit-bg: #FEE2E2;
  --info: #0284C7;
  --info-bg: #E0F2FE;
  --off: #64748B;
  --off-bg: #F1F5F9;
  --shadow: 0 2px 8px rgba(11, 16, 32, 0.04);
  --shadow-md: 0 4px 14px rgba(11, 16, 32, 0.06);
  --shadow-lg: 0 8px 24px rgba(11, 16, 32, 0.08);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* Header */
header {
  background: var(--ink);
  color: #FFFFFF;
  padding: 14px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand h1 { font-size: 17px; font-weight: 800; margin: 0; letter-spacing: -0.01em; color: #FFFFFF; }
.badge-profile {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 10px;
  border-radius: 99px;
  background: rgba(91, 95, 239, 0.25);
  color: #C7CBF8;
  border: 1px solid rgba(165, 180, 252, 0.35);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.header-links { display: flex; align-items: center; gap: 16px; font-size: 13.5px; }
.header-links a { color: #CBD5E1; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: color 0.15s ease; }
.header-links a:hover { color: #FFFFFF; }

/* Navigation */
nav {
  background: #FFFFFF;
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  white-space: nowrap;
  box-shadow: 0 1px 3px rgba(11, 16, 32, 0.02);
}
nav button {
  background: none;
  border: 0;
  padding: 14px 16px;
  font-size: 13.5px;
  font-weight: 700;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  min-height: 48px;
  transition: all 0.15s ease;
}
nav button.active, nav button:hover {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

/* Layout */
main { max-width: 1440px; margin: 0 auto; padding: 28px; }

/* Dashboard Hero */
.dash-hero {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px 26px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 18px;
  box-shadow: var(--shadow);
}
.dash-hero-title-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.dash-hero-title {
  font-size: 20px;
  font-weight: 850;
  margin: 0;
  color: var(--ink);
}
.dash-hero-badge {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid rgba(91, 95, 239, 0.2);
  text-transform: uppercase;
}
.dash-hero-subtitle {
  font-size: 13.5px;
  color: var(--muted);
  margin: 0;
  line-height: 1.5;
}
.dash-hero-meta {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
}
.meta-pill {
  font-size: 12px;
  font-weight: 600;
  color: var(--ink2);
  background: #F8FAFC;
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* Status Cards & Banners */
.banner-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.banner {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 22px;
  box-shadow: var(--shadow);
}
.banner-title {
  font-size: 11.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.banner-items {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding-bottom: 8px;
  border-bottom: 1px solid #F1F5F9;
}
.status-row:last-child {
  border-bottom: none;
  padding-bottom: 0;
}
.status-row-label {
  font-weight: 650;
  color: var(--ink);
}
.status-row-sub {
  font-size: 11.5px;
  color: var(--muted);
}

/* Status Chips */
.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 750;
  padding: 4px 10px;
  border-radius: 8px;
  background: #F8FAFC;
  border: 1px solid var(--border);
}
.tag-chip.ready { background: var(--ok-bg); color: var(--ok); border-color: rgba(22, 163, 74, 0.2); }
.tag-chip.warn { background: var(--warn-bg); color: var(--warn); border-color: rgba(217, 119, 6, 0.2); }
.tag-chip.pending { background: #FEF3C7; color: #92400E; border-color: #FDE68A; }
.tag-chip.info { background: var(--info-bg); color: var(--info); border-color: rgba(2, 132, 199, 0.2); }

/* KPI Grid */
.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.kpi:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
.kpi .label {
  font-size: 12px;
  font-weight: 750;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.kpi .value {
  font-size: 26px;
  font-weight: 850;
  color: var(--ink);
  margin-top: 6px;
  letter-spacing: -0.02em;
}
.kpi .sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  font-weight: 500;
}

/* Empty Dashboard Teaching Card */
.empty-teach-card {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
}
.empty-teach-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--ink);
  margin-bottom: 6px;
}
.empty-teach-desc {
  font-size: 13.5px;
  color: var(--muted);
  margin: 0;
  line-height: 1.5;
  max-width: 680px;
}
.empty-teach-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}

/* Panels */
.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.panel-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  flex-wrap: wrap;
  gap: 12px;
}
.panel h2 {
  font-size: 17px;
  font-weight: 850;
  margin: 0;
  color: var(--ink);
}

/* Tables */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 13px 16px; border-bottom: 1px solid var(--border); }
th {
  background: #F8FAFC;
  color: var(--muted);
  font-weight: 800;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
tr:hover { background: #FAFBFD; }

/* Badges */
.badge { display: inline-block; padding: 3px 9px; border-radius: 99px; font-size: 11.5px; font-weight: 800; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.crit { background: var(--crit-bg); color: var(--crit); }
.badge.info { background: var(--info-bg); color: var(--info); }
.badge.off { background: var(--off-bg); color: var(--off); }

/* Buttons & Inputs */
.btn {
  background: var(--accent);
  color: #FFFFFF;
  border: 0;
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 13.5px;
  font-weight: 750;
  cursor: pointer;
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: background 0.15s ease, transform 0.15s ease;
  text-decoration: none;
}
.btn:hover { background: var(--accent-hover); }
.btn.line { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn.line:hover { background: var(--accent-bg); }
.btn.sm { padding: 6px 12px; font-size: 12px; min-height: 32px; border-radius: 6px; }
.btn.sim { background: #0284C7; color: #FFFFFF; }
.btn.sim:hover { background: #0369A1; }

input, select, textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 13.5px;
  outline: none;
  background: #FFFFFF;
  color: var(--ink);
  transition: border-color 0.15s ease;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); }

/* Operational Flow Visual */
.flow-step-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 0 16px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.flow-step {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 800;
  color: var(--muted);
  background: #F1F5F9;
  padding: 6px 12px;
  border-radius: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.flow-step.active {
  background: var(--accent-bg);
  color: var(--accent);
  border: 1px solid rgba(91, 95, 239, 0.3);
}
.flow-arrow {
  color: #CBD5E1;
  font-size: 12px;
  font-weight: 800;
}

/* Quick Test Simulator Card */
.sim-card {
  background: #F0F9FF;
  border: 1.5px solid #BAE6FD;
  border-radius: 14px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.sim-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
}
.sim-badge {
  background: #0284C7;
  color: #FFFFFF;
  font-size: 11px;
  font-weight: 850;
  padding: 3px 10px;
  border-radius: 99px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

/* Simulator Feedback Card */
.sim-feedback-card {
  background: #FFFFFF;
  border: 1px solid #BAE6FD;
  border-radius: 10px;
  padding: 16px;
  margin-top: 14px;
}
.sim-feedback-head {
  font-weight: 800;
  color: #0369A1;
  font-size: 13.5px;
  margin-bottom: 8px;
}
.sim-feedback-list {
  margin: 8px 0 12px;
  padding-left: 18px;
  font-size: 12.5px;
  color: #334155;
  line-height: 1.6;
}

/* Readiness Checklist Component */
.readiness-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 14px;
}
.readiness-item {
  background: #FFFFFF;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 16px;
  transition: border-color 0.15s ease;
}
.readiness-item-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
}
.readiness-item-title {
  font-size: 13.5px;
  font-weight: 750;
  color: var(--ink);
}
.readiness-item-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 2px;
}
.readiness-details {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid #F1F5F9;
  font-size: 12.5px;
  color: var(--ink2);
  line-height: 1.6;
  display: none;
}
.readiness-details.open {
  display: block;
}

/* Empty State Container */
.empty-box {
  text-align: center;
  padding: 44px 20px;
  color: var(--muted);
}
.empty-box-title {
  font-size: 15px;
  font-weight: 800;
  color: var(--ink2);
  margin-bottom: 6px;
}
.empty-box-desc {
  font-size: 13px;
  color: var(--muted);
  max-width: 480px;
  margin: 0 auto 16px;
}

/* Profile Onboarding */
.profile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 20px 0; }
.profile-card {
  background: #FFFFFF;
  border: 2px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.profile-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.profile-card.selected { border-color: var(--accent); background: var(--accent-bg); }
.profile-card h3 { font-size: 16px; font-weight: 850; margin: 0 0 6px; }
.profile-card p { font-size: 13px; color: var(--muted); margin: 0; line-height: 1.5; }

/* Responsive adjustments */
@media (max-width: 768px) {
  main { padding: 16px; }
  .kpis { grid-template-columns: repeat(2, 1fr); }
  th, td { padding: 10px 8px; font-size: 12px; }
  .dash-hero { padding: 16px; }
}
@media (max-width: 480px) {
  .kpis { grid-template-columns: 1fr; }
  header { padding: 12px 16px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>BotConnector Parking</h1>
    <span class="badge-profile" id="hdr-profile">FULL STACK</span>
  </div>
  <div class="header-links">
    <button class="btn sm" onclick="openParkingGuideModal()" style="background:#1E293B;color:#FFFFFF;border:1px solid #334155;cursor:pointer;font-weight:750">? Panduan Operasional</button>
    <span id="hdr-user" style="color:#CBD5E1;font-weight:600"></span>
    <a href="/my-products">&larr; Kembali ke Produk Saya</a>
  </div>
</header>

<nav id="nav-tabs">
  <!-- Dynamic tabs loaded by JS based on deployment profile -->
</nav>

<main id="app-container">
  <div style="text-align:center;padding:60px 20px;color:var(--muted)">
    Memuat BotConnector Parking&hellip;
  </div>
</main>

<!-- Support AI V3 Interactive Client Script -->
<script src="/static/js/support_ai_widget.js"></script>

<script>
const API = '/parking/api';
let APP_STATE = null;
let ACTIVE_TAB = 'dashboard';

function badge(s) {
  const v = String(s || '').toUpperCase();
  if (['ONLINE', 'ACTIVE', 'OPEN', 'PAID', 'DELIVERED', 'SUCCEEDED'].includes(v)) return `<span class="badge ok">${s}</span>`;
  if (['OFFLINE', 'CLOSED', 'EXPIRED', 'FAILED'].includes(v)) return `<span class="badge crit">${s}</span>`;
  if (['PENDING', 'MAINTENANCE', 'MANUAL_REVIEW', 'CREATED'].includes(v)) return `<span class="badge warn">${s}</span>`;
  return `<span class="badge off">${s || 'UNKNOWN'}</span>`;
}

async function api(url, opts = {}) {
  opts.headers = opts.headers || {};
  opts.headers['Accept'] = 'application/json';
  if (opts.body && typeof opts.body === 'object' && !(opts.body instanceof FormData)) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(url, opts);
  if (!r.ok) {
    let msg = 'Request failed';
    try { const j = await r.json(); msg = j.error?.message || j.detail || msg; } catch(e){}
    throw new Error(msg);
  }
  return r.json();
}

async function loadAppState() {
  try {
    const res = await api(`${API}/customer/me`);
    APP_STATE = res;
    window.APP_STATE = res;
    render();
  } catch (err) {
    document.getElementById('app-container').innerHTML = `
      <div class="panel" style="max-width:540px;margin:60px auto;text-align:center">
        <h2 style="color:var(--crit)">Gagal Memuat Sesi</h2>
        <p style="color:var(--muted)">${err.message}</p>
        <a href="/login?next=/parking/" class="btn" style="margin-top:14px">Login Ulang</a>
      </div>
    `;
  }
}

function render() {
  if (!APP_STATE || !APP_STATE.authenticated) {
    window.location.href = '/login?next=/parking/';
    return;
  }

  document.getElementById('hdr-user').textContent = APP_STATE.user?.email || APP_STATE.user?.name || '';
  const profile = APP_STATE.deployment_profile || 'FULL_STACK';
  document.getElementById('hdr-profile').textContent = profile.replace('_', ' ');

  if (!APP_STATE.entitled) {
    renderActivation();
    return;
  }
  if (!APP_STATE.provisioned) {
    renderOnboarding();
    return;
  }

  renderNav(profile);
  renderView(profile);
}

function renderActivation() {
  document.getElementById('nav-tabs').innerHTML = '';
  document.getElementById('app-container').innerHTML = `
    <div class="panel" style="max-width:640px;margin:40px auto;text-align:center;padding:44px 32px">
      <div style="font-size:11px;font-weight:850;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px">PRODUK BOTCONNECTOR</div>
      <h2 style="font-size:26px;margin:0 0 12px;color:var(--ink)">BotConnector Parking</h2>
      <p style="color:var(--muted);font-size:14.5px;margin:0 0 28px;line-height:1.6">
        Sistem manajemen operasional parkir modern untuk kontrol gerbang, tarif otomatis, kamera ANPR, gateway offline Edge, dan integrasi QRIS / Tunai.
      </p>
      <div style="background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:20px;text-align:left;margin-bottom:28px">
        <div style="font-weight:750;font-size:13.5px;margin-bottom:10px;color:var(--ink)">Fitur Siap Digunakan:</div>
        <ul style="margin:0;padding-left:20px;font-size:13px;color:var(--muted);line-height:1.8">
          <li>Pengaturan Gerbang, Lane &amp; Kapasitas Parkir Multi-Site</li>
          <li>Kalkulasi Tarif Otomatis (Flat, Hourly, Progresif)</li>
          <li>ANPR Software Ready (Profile M Contract) &amp; Palang Fail-Closed</li>
          <li>Mode Simulasi Langsung untuk Pengujian Tanpa Hardware</li>
        </ul>
      </div>
      <button class="btn" style="width:100%" onclick="handleActivate()">Aktifkan BotConnector Parking Sekarang</button>
    </div>
  `;
}

async function handleActivate() {
  try {
    await api(`${API}/customer/activate`, { method: 'POST' });
    await loadAppState();
  } catch (err) {
    alert(err.message || 'Aktivasi belum berhasil. Silakan coba lagi.');
  }
}

let selectedProfile = 'FULL_STACK';
function renderOnboarding() {
  document.getElementById('nav-tabs').innerHTML = '';
  document.getElementById('app-container').innerHTML = `
    <div class="panel" style="max-width:780px;margin:30px auto;padding:36px">
      <div style="font-size:11px;font-weight:850;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:6px">PENGATURAN AWAL</div>
      <h2 style="font-size:24px;margin:0 0 8px;color:var(--ink)">Bagaimana Anda ingin menggunakan BotConnector Parking?</h2>
      <p style="color:var(--muted);font-size:14px;margin:0 0 24px;line-height:1.5">Pilih profil implementasi yang paling sesuai dengan kebutuhan operasional Anda. Anda dapat mengubahnya sewaktu-waktu tanpa kehilangan data.</p>

      <div class="profile-grid">
        <div class="profile-card ${selectedProfile === 'FULL_STACK' ? 'selected' : ''}" onclick="selectProf('FULL_STACK')">
          <h3>A. Sistem Parkir Lengkap</h3>
          <p>Gunakan BotConnector sebagai OS parkir lengkap: site, gerbang, tarif otomatis, ANPR kamera, Edge gateway, dan pembayaran.</p>
        </div>
        <div class="profile-card ${selectedProfile === 'EXISTING_HARDWARE' ? 'selected' : ''}" onclick="selectProf('EXISTING_HARDWARE')">
          <h3>B. Hubungkan Hardware Ada</h3>
          <p>Gunakan software &amp; tarif BotConnector untuk menghubungkan kamera ANPR, palang, dan controller yang sudah terpasang.</p>
        </div>
        <div class="profile-card ${selectedProfile === 'PAYMENT_ONLY' ? 'selected' : ''}" onclick="selectProf('PAYMENT_ONLY')">
          <h3>C. Pembayaran Saja</h3>

function selectProf(p) {
  selectedProfile = p;
  document.querySelectorAll('.profile-card').forEach(c => c.classList.remove('selected'));
  renderOnboarding();
  const fullEl = document.getElementById('full-fields');
  const payEl = document.getElementById('payment-only-fields');
  const siteCodeEl = document.getElementById('field-site-code');
  if (p === 'PAYMENT_ONLY') {
    if (fullEl) fullEl.style.display = 'none';
    if (payEl) payEl.style.display = 'block';
    if (siteCodeEl) siteCodeEl.style.display = 'none';
  } else {
    if (fullEl) fullEl.style.display = 'block';
    if (payEl) payEl.style.display = 'none';
    if (siteCodeEl) siteCodeEl.style.display = 'block';
  }
}

async function handleProvision(e) {
  e.preventDefault();
  const payload = {
    deployment_profile: selectedProfile,
    organization_name: document.getElementById('ob-org').value,
    site_code: document.getElementById('ob-code')?.value || 'SITE-01',
    site_name: document.getElementById('ob-org').value,
    capacity: parseInt(document.getElementById('ob-cap')?.value || '100'),
    tariff_type: document.getElementById('ob-tariff')?.value || 'FLAT',
    rate: document.getElementById('ob-tariff')?.value === 'HOURLY' ? 3000 : 5000,
    webhook_url: document.getElementById('ob-webhook')?.value || null,
  };
  try {
    await api(`${API}/customer/provision`, { method: 'POST', body: payload });
    await loadAppState();
  } catch (err) {
    alert('Pengaturan gagal: ' + err.message);
  }
}

function renderNav(profile) {
  let tabs = [];
  if (profile === 'PAYMENT_ONLY') {
    tabs = [
      ['dashboard', 'Dashboard'],
      ['transactions', 'Transaksi'],
      ['qris', 'QRIS & Gateway'],
      ['api_docs', 'Integrasi API'],
      ['reconciliation', 'Rekonsiliasi'],
      ['settings', 'Pengaturan'],
    ];
  } else {
    tabs = [
      ['dashboard', 'Dashboard'],
      ['live', 'Live Parking'],
      ['simulator', '✦ Mode Simulasi'],
      ['gates', 'Gate & Lane'],
      ['devices', 'Devices'],
      ['anpr', 'ANPR Review'],
      ['reports', 'Reports'],
      ['audit', 'Audit'],
      ['settings', 'Pengaturan'],
    ];
  }

  const nav = document.getElementById('nav-tabs');
  nav.innerHTML = tabs.map(([k, label]) => `
    <button class="${ACTIVE_TAB === k ? 'active' : ''}" onclick="switchTab('${k}')">${label}</button>
  `).join('');
}

function switchTab(t) {
  ACTIVE_TAB = t;
  window.ACTIVE_TAB = t;
  const profile = APP_STATE.deployment_profile || 'FULL_STACK';
  renderNav(profile);
  renderView(profile);
}

function renderView(profile) {
  const container = document.getElementById('app-container');
  if (profile === 'PAYMENT_ONLY') {
    renderPaymentOnlyView(container);
  } else {
    renderFullStackView(container);
  }
}

async function executeSimExit(publicRef) {
  if (!confirm('Jalankan simulasi hitung tarif, settlement pembayaran, dan buka palang untuk tiket ini?')) return;
  try {
    const res = await api(`${API}/customer/simulate-exit`, { method: 'POST', body: { public_reference: publicRef } });
    alert(`Sukses!\nTotal Tarif: Rp ${(res.total_amount || 0).toLocaleString('id-ID')}\nStatus: ${res.message}`);
    loadSimLiveSessions(APP_STATE.site?.id || 1);
  } catch (err) {
    alert('Simulasi keluar gagal: ' + err.message);
  }
}

            <option value="FULL_STACK" ${curProf === 'FULL_STACK' ? 'selected' : ''}>FULL_STACK — Sistem Parkir Lengkap</option>
            <option value="EXISTING_HARDWARE" ${curProf === 'EXISTING_HARDWARE' ? 'selected' : ''}>EXISTING_HARDWARE — Hubungkan Hardware yang Ada</option>
            <option value="PAYMENT_ONLY" ${curProf === 'PAYMENT_ONLY' ? 'selected' : ''}>PAYMENT_ONLY — Integrasi Pembayaran Saja</option>
          </select>
        </div>

        <div style="margin-bottom:20px">
          <label style="display:block;font-size:13px;font-weight:750;margin-bottom:6px">URL Webhook Notifikasi</label>
          <input type="url" id="set-webhook" value="${APP_STATE.tenant?.webhook_url || ''}" placeholder="https://domain-anda.com/api/parking-webhook">
        </div>

        <button type="submit" class="btn">Simpan Perubahan Profil</button>
      </form>
    </div>
  `;
}

async function handleUpdateProfile(e) {
  e.preventDefault();
  const prof = document.getElementById('set-prof').value;
  const webhook_url = document.getElementById('set-webhook').value;
  try {
    await api(`${API}/customer/update-profile`, { method: 'POST', body: { deployment_profile: prof, webhook_url } });
    alert('Profil berhasil diperbarui!');
    await loadAppState();
  } catch (err) {
    alert('Gagal memperbarui: ' + err.message);
  }
}

/* ================= STATUS KESIAPAN ACCORDION & CHECKLIST ================= */

  const el = document.getElementById(id);
  if (el) el.classList.toggle('open');
}

      { id: 'rd-6', name: 'Simulasi Pembayaran & Keluar', status: 'Siap Diuji', desc: 'Bayar tarif parkir dan buka palang keluar.', cara: 'Klik Simulasi Keluar Gerbang pada tab Mode Simulasi.', hasil: 'Sesi ditutup (CLOSED) dan palang keluar terbuka secara aman.' },

      { id: 'rd-3', name: 'ANPR Contract (Profile M)', status: 'Siap', desc: 'Software siap menerima metadata plat nomor Profile M.', cara: 'Pastikan kamera ANPR mendukung streaming metadata ONVIF Profile M.', hasil: 'Plat nomor terbaca otomatis tanpa modul OCR terpisah.' },
      { id: 'rd-4', name: 'Barrier Safety (Fail-Closed)', status: 'Siap', desc: 'Software tidak membuka palang jika koneksi terputus.', cara: 'Prinsip fail-closed aktif secara default demi keamanan.', hasil: 'Palang tetap tertutup saat terjadi pemadaman listrik/sinyal.' },
      { id: 'rd-5', name: 'Simulasi Alur Software (Dry Run)', status: 'Siap Diuji', desc: 'Uji alur kendaraan tanpa kamera fisik.', cara: 'Jalankan simulasi kendaraan masuk dan keluar di tab Simulator.', hasil: 'Semua alur bisnis terverifikasi sebelum uji perangkat fisik.' },
      { id: 'rd-6', name: 'Uji Lapangan Hardware Fisik', status: 'Menunggu Pengujian', desc: 'Verifikasi palang & kamera di lokasi riil.', cara: 'Jalankan capability probe langsung di lokasi fisik gerbang.', hasil: 'Status hardware berubah menjadi VERIFIED setelah uji lapangan.' },
      { id: 'rd-7', name: 'Health Check & Monitoring', status: 'Siap', desc: 'Pantau status detak online/offline perangkat.', cara: 'Cek heartbeat perangkat pada tab Devices secara berkala.', hasil: 'Notifikasi otomatis jika ada perangkat yang terputus.' },
    ];
  } else if (profile === 'PAYMENT_ONLY') {
    items = [
      { id: 'rd-1', name: 'Pahami Alur Payment Gateway', status: 'Siap', desc: 'Sistem parkir eksternal Anda &rarr; Payment API BotConnector.', cara: 'PMS eksternal memanggil endpoint POST /parking/api/payment-gateway/orders.', hasil: 'Payment reference unik diterbitkan.' },
      { id: 'rd-2', name: 'Buat Sandbox Order Pertama', status: 'Siap Diuji', desc: 'Generate payment reference & QRIS MPM Dynamic.', cara: 'Gunakan form Sandbox Test Order pada tab Dashboard.', hasil: 'Payload QRIS MPM siap di-scan aplikasi perbankan.' },
      { id: 'rd-3', name: 'Simulasikan Pembayaran Selesai', status: 'Siap Diuji', desc: 'Simulasi bayar instan untuk memicu webhook.', cara: 'Klik tombol Settle Pay pada order sandbox.', hasil: 'Status order berubah menjadi PAID.' },

  }

  const readyCount = items.filter(i => i.status === 'Siap' || i.status === 'Siap Diuji').length;
  const totalCount = items.length;

  const rows = items.map((it, idx) => `
    <div class="readiness-item">
      <div class="readiness-item-head" onclick="toggleReadinessDetail('${it.id}')">

  return `
    <div class="panel" style="margin-bottom:24px">

      </div>
      <div class="readiness-list">${rows}</div>
    </div>
  `;
}
