services:
  drive:
    image: botconnector-drive:0.2.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: botconnector-drive

    restart: "no"

    user: "10001:10001"

    group_add:
      - "983"

    env_file:
      - .env

    ports:
      - "127.0.0.1:18190:8000"

    volumes:
      - type: bind
        source: /mnt/botconnector-storage
        target: /data/drive
        bind:
          create_host_path: false

      - type: bind
        source: /var/lib/botconnector-drive/tmp
        target: /tmp
        bind:
          create_host_path: false

      - type: bind
        source: /var/lib/botconnector-drive/meta
        target: /data/meta
        bind:
          create_host_path: false

    networks:
      - core

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 128

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

    stop_grace_period: 10s

networks:
  core:
    external: true
    name: botconnector-core-net
