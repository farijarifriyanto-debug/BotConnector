name: cloud-efficiency-benchmark

on:
  push:
    branches:
      - "feat/cloud-efficiency-runner"
    paths:
      - ".github/workflows/cloud-efficiency-benchmark.yml"
      - "cloud-efficiency/benchmark/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download known-good context optimizer image
        uses: actions/download-artifact@v4
        with:
          name: context-optimizer-c7642e5a94f5cf0006a39d90f723d692034f12fe
          path: /tmp/context-optimizer
          github-token: ${{ github.token }}
          repository: farijarifriyanto-debug/BotConnector
          run-id: 36052887228

      - name: Load and start LLMLingua optimizer
        run: |
          gunzip -c /tmp/context-optimizer/context-optimizer-image.tar.gz | docker load
          IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep '^botconnector-context-optimizer:' | head -n1)"
          test -n "$IMAGE"
          docker run -d --name optimizer-bench -p 127.0.0.1:18091:8091 "$IMAGE"
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:18091/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs optimizer-bench
          exit 1

      - name: Start local multilingual embeddings
        run: |
          docker run -d --name tei-bench \
            -p 127.0.0.1:18092:80 \
            -v "${RUNNER_TEMP}/tei-data:/data" \
            ghcr.io/huggingface/text-embeddings-inference:cpu-1.9 \
            --model-id intfloat/multilingual-e5-small --port 80
          for i in {1..180}; do
            if curl -fsS http://127.0.0.1:18092/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs tei-bench
          exit 1

      - name: Run savings benchmark
        run: |
          python -m pip install --disable-pip-version-check tiktoken==0.11.0
          python cloud-efficiency/benchmark/benchmark.py
          cat cloud-efficiency/benchmark/RESULT.md
        env:
          OPTIMIZER_URL: http://127.0.0.1:18091
          EMBEDDINGS_URL: http://127.0.0.1:18092
          SEMANTIC_THRESHOLD: "0.92"
          COMPRESSION_RATE: "0.65"

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-efficiency-benchmark-${{ github.sha }}
          path: |
            cloud-efficiency/benchmark/result.json
            cloud-efficiency/benchmark/RESULT.md
          retention-days: 30
