    - generic [ref=f10e21]:
      - generic [ref=f10e22]: Botconnector
      - heading "Kebijakan Privasi" [level=1] [ref=f10e23]
      - generic [ref=f10e24]:
        - heading "1. Data yang digunakan" [level=2] [ref=f10e25]
        - paragraph [ref=f10e26]: Botconnector dapat menyimpan informasi akun, EA dan terminal, broker/server, mapping simbol, lot, trailing, alert yang diterima, status eksekusi, laporan transaksi, dan log keamanan.
        - heading "2. Tujuan penggunaan" [level=2] [ref=f10e27]
        - paragraph [ref=f10e28]: Data digunakan untuk menjalankan webhook, menghubungkan terminal, meneruskan instruksi, mencegah duplikasi, menampilkan status dan laporan, memeriksa masalah, serta menjaga keamanan layanan.
        - heading "3. Kerahasiaan" [level=2] [ref=f10e29]
        - paragraph [ref=f10e30]: Botconnector tidak menjual data pribadi pengguna. Akses terhadap data dibatasi untuk kebutuhan pengoperasian, keamanan, dan dukungan.
        - heading "4. Kredensial MetaTrader" [level=2] [ref=f10e31]
        - paragraph [ref=f10e32]: Password akun broker tidak perlu dikirim ke server Botconnector. Koneksi MetaTrader dijalankan oleh EA pada perangkat Windows pengguna.
        - heading "5. Penyimpanan dan penghapusan" [level=2] [ref=f10e33]
        - paragraph [ref=f10e34]: Data disimpan selama diperlukan untuk pengoperasian, keamanan, pelaporan, dan pemeriksaan masalah. Pengguna dapat meminta penutupan akun dan penghapusan data yang tidak lagi perlu disimpan.
        - heading "6. Keamanan data" [level=2] [ref=f10e35]
        - paragraph [ref=f10e36]: Botconnector menggunakan langkah keamanan yang wajar, termasuk hashing password dan token serta enkripsi secret webhook yang dapat disalin kembali oleh pemilik akun.
        - heading "7. Cookie analitik dan Google Analytics" [level=2] [ref=f10e37]
        - paragraph [ref=f10e38]: Botconnector menggunakan Google Tag Manager dan Google Analytics 4 hanya setelah pengguna memberikan izin analitik. Pengukuran ini membantu memahami halaman yang digunakan, sumber kunjungan, download, dan tindakan umum pada website.
        - paragraph [ref=f10e39]: Botconnector tidak mengirim password, email, nomor telepon, secret webhook, Token Agent, nomor akun broker, isi alert, atau detail transaksi melalui event Analytics yang dibuat khusus.
        - paragraph [ref=f10e40]: Pilihan analitik disimpan pada browser pengguna. Pengguna dapat menolak, mengizinkan, atau mengubah pilihan tersebut kapan saja. Ketika izin dicabut, cookie Analytics pihak pertama yang dapat diakses website akan dihapus dan halaman dimuat ulang tanpa memuat Google Tag Manager.
        - paragraph [ref=f10e41]:
          - strong [ref=f10e42]: "Status pilihan saat ini:"
          - text: Belum dipilih
        - button "Atur Pilihan Analitik" [ref=f10e43] [cursor=pointer]
