      - generic [ref=f9e22]: Botconnector
      - heading "Ketentuan Layanan" [level=1] [ref=f9e23]
      - generic [ref=f9e24]:
        - heading "1. Tentang layanan" [level=2] [ref=f9e25]
        - paragraph [ref=f9e26]: Botconnector menyediakan koneksi otomatis antara TradingView dan MetaTrader. Instruksi diproses berdasarkan alert dan pengaturan yang dibuat oleh pengguna.
        - heading "2. Penggunaan layanan" [level=2] [ref=f9e27]
        - paragraph [ref=f9e28]: Pengguna bertanggung jawab untuk memeriksa webhook, mapping simbol, terminal MetaTrader, lot, trailing, dan status LIVE sebelum digunakan.
        - paragraph [ref=f9e29]: Mode CAPTURE disediakan untuk memeriksa alur tanpa meneruskan instruksi ke MetaTrader.
        - heading "3. Hasil penggunaan" [level=2] [ref=f9e30]
        - paragraph [ref=f9e31]:
          - strong [ref=f9e32]: Hasil trading bergantung pada strategi dan pengaturan masing-masing pengguna. Botconnector hanya meneruskan instruksi yang diterima dan tidak bertanggung jawab atas keuntungan atau kerugian yang timbul dari penggunaannya.
        - heading "4. Gangguan teknis" [level=2] [ref=f9e33]
        - paragraph [ref=f9e34]: Pemrosesan dapat dipengaruhi oleh koneksi internet, VPS, TradingView, MetaTrader, broker, pusat data, pemeliharaan, latensi, spread, slippage, atau layanan pihak ketiga. Instruksi dapat terlambat, ditolak, atau gagal pada kondisi tersebut.
        - heading "5. Keamanan" [level=2] [ref=f9e35]
        - paragraph [ref=f9e36]: Pengguna wajib menjaga kerahasiaan URL webhook, token Agent, akses VPS, dan akun yang digunakan. Gunakan Ganti secret atau Pause LIVE bila akses diduga tidak aman.
        - heading "6. Perubahan layanan" [level=2] [ref=f9e37]
        - paragraph [ref=f9e38]: Fitur dan ketentuan dapat diperbarui untuk meningkatkan keamanan, stabilitas, dan pengalaman penggunaan.
