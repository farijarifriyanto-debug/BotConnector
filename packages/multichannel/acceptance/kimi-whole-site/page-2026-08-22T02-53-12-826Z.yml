        - generic [ref=f33e38]: BotConnector Documentation
        - heading "Dokumentasi produk & integrasi." [level=1] [ref=f33e39]
        - paragraph [ref=f33e40]: Panduan untuk menjalankan Business Suite — Retail POS, Restaurant, Inventory, Multi-Cabang, Transfer, KDS, Reporting — serta integrasi lokal dan otomasi event-driven.
        - generic [ref=f33e41]:
          - link "01 Buka Business Suite Dashboard, POS, order, produk, stok, transfer, KDS, dan laporan." [ref=f33e42] [cursor=pointer]:
            - /url: /bisnis/
            - generic [ref=f33e43]: "01"
            - strong [ref=f33e44]: Buka Business Suite
            - paragraph [ref=f33e45]: Dashboard, POS, order, produk, stok, transfer, KDS, dan laporan.
          - link "02 Mulai dengan Retail POS Kasir, barcode, cart, tender, receipt, retur, dan offline." [ref=f33e46] [cursor=pointer]:
            - /url: "#retail"
            - generic [ref=f33e47]: "02"
            - strong [ref=f33e48]: Mulai dengan Retail POS
            - paragraph [ref=f33e49]: Kasir, barcode, cart, tender, receipt, retur, dan offline.
          - link "03 Jalankan Restaurant Menu, resep/BOM, KDS/KOT, dine-in/takeaway, QR self-order." [ref=f33e50] [cursor=pointer]:
            - /url: "#restaurant"
            - generic [ref=f33e51]: "03"
            - strong [ref=f33e52]: Jalankan Restaurant
            - paragraph [ref=f33e53]: Menu, resep/BOM, KDS/KOT, dine-in/takeaway, QR self-order.
          - link "04 Hubungkan sistem CSV, barcode, QR, marketplace, food delivery, webhook/API." [ref=f33e54] [cursor=pointer]:
            - /url: "#integrations"
            - generic [ref=f33e55]: "04"
            - strong [ref=f33e56]: Hubungkan sistem
            - paragraph [ref=f33e57]: CSV, barcode, QR, marketplace, food delivery, webhook/API.
      - generic [ref=f33e58]:
        - generic [ref=f33e59]: Business Suite
        - heading "Satu aplikasi untuk seluruh operasional." [level=2] [ref=f33e60]
        - paragraph [ref=f33e61]: Business Suite menyatukan POS retail & restoran, produk/SKU master, inventori pusat, multi-cabang, transfer, KDS, reporting, dan finance dalam satu aplikasi berbasis web. Setiap transaksi langsung memengaruhi stok dan laporan.
        - paragraph [ref=f33e62]:
          - text: Akses langsung di
          - link /bisnis/ [ref=f33e63] [cursor=pointer]:
            - /url: /bisnis/
          - text: ". Modul tersedia: Dashboard, POS, Orders, Products, Inventory, Transfers, Restaurant, Kitchen, Reports, Integrasi."
      - generic [ref=f33e64]:
        - generic [ref=f33e65]: Retail POS
        - heading "Kasir toko dengan stok terhubung." [level=2] [ref=f33e66]
        - paragraph [ref=f33e67]: POS retail mendukung pencarian produk, scan barcode, cart, qty, diskon, tender tunai/QRIS/kartu/transfer, receipt, dan sale history. Setiap penjualan mengurangi stok cabang dan mencatat COGS ke finance.
        - paragraph [ref=f33e68]: "Fitur utama: barcode keyboard-wedge, alias barcode, retur, void, shift, multi-register, multi-cabang, dan mode offline dengan sinkronisasi idempoten."
      - generic [ref=f33e69]:
        - generic [ref=f33e70]: Restaurant
        - heading "POS restoran berbasis resep." [level=2] [ref=f33e71]
        - paragraph [ref=f33e72]: Restaurant POS mendukung dine-in dan takeaway, pemilihan meja, guest count, order line, notes, dan pembayaran. Setiap order restoran tersambung ke resep/BOM sehingga ingredient inventory berkurang secara otomatis.
        - paragraph [ref=f33e73]: Laporan restoran mencakup food sales, beverage sales, COGS, gross profit, dan gross margin per kategori serta kanal.
      - generic [ref=f33e74]:
        - generic [ref=f33e75]: Inventory
        - heading "Stok pusat location-aware." [level=2] [ref=f33e76]
        - paragraph [ref=f33e77]: "Inventory menggunakan terminologi operasional: Stok Fisik, Dipesan/Reserved, Dalam Perjalanan/In Transit, dan Stok Tersedia. Setiap cabang dan gudang adalah lokasi tersendiri dengan saldo independen."
        - paragraph [ref=f33e78]: "Fitur: produk/SKU master, low-stock alert, opname, waste/spoilage, transfer antar cabang, dan konservasi stok."
      - generic [ref=f33e79]:
        - generic [ref=f33e80]: Transfer
        - heading "Transfer stok antar cabang." [level=2] [ref=f33e81]
        - paragraph [ref=f33e82]: "Transfer memiliki lifecycle yang jelas: Dibuat → Disetujui → Dikirim → Dalam Perjalanan → Diterima. Status dan qty setiap item terlihat sehingga stok tidak hilang di tengah jalan."
      - generic [ref=f33e83]:
        - generic [ref=f33e84]: KDS / KOT
        - heading "Kitchen Display System." [level=2] [ref=f33e85]
        - paragraph [ref=f33e86]: "KDS menampilkan Kitchen Order Ticket dalam lane: Baru, Diproses, Siap, Selesai. Desain dioptimalkan untuk terbaca dari jarak di dapur. Setiap perubahan status memperbarui prioritas antrean dan waktu elapsed."
      - generic [ref=f33e87]:
        - generic [ref=f33e88]: Reporting
        - heading "Laporan bisnis real-time." [level=2] [ref=f33e89]
        - paragraph [ref=f33e90]: "Reports menyediakan KPI card dan tabel berdasarkan data operasional: penjualan retail, restaurant, food/beverage, COGS, gross profit, gross margin, channel, waste, dan perbandingan cabang. Tidak ada data palsu; angka berasal dari transaksi tercatat."
      - generic [ref=f33e91]:
        - generic [ref=f33e92]: Integrasi
        - heading "Hubungkan channel dan perangkat." [level=2] [ref=f33e93]
        - paragraph [ref=f33e94]: "Integrasi dikelompokkan berdasarkan jenis dan status ketersediaan. Status ditampilkan secara jujur: Tersedia, Beta, Segera Hadir, atau Roadmap."
