        - generic [ref=f33e143]: CSV & Barcode
        - heading "Impor/ekspor dan scan langsung." [level=2] [ref=f33e144]
        - paragraph [ref=f33e145]: CSV/XLSX mendukung impor produk, stok, dan penjualan dengan mapping kolom, dry-run, dan deteksi duplikat. Barcode scanner keyboard-wedge langsung mencari SKU tanpa konfigurasi tambahan.
      - generic [ref=f33e146]:
        - generic [ref=f33e147]: Webhook / API
        - heading "Webhook dan HTTP/API." [level=2] [ref=f33e148]
        - paragraph [ref=f33e149]: Webhook menerima event JSON melalui HTTPS. HTTP/API digunakan untuk meneruskan hasil workflow ke endpoint tujuan. Semua komunikasi menggunakan HTTPS, retry otomatis, idempotency, dan credential disimpan server-side.
