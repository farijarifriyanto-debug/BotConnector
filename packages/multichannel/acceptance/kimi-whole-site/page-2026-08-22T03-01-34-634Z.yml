            - strong [ref=f50e56]: Hubungkan sistem
            - paragraph [ref=f50e57]: CSV, barcode, QR, marketplace, food delivery, webhook/API.
      - generic [ref=f50e58]:
        - generic [ref=f50e59]: Business Suite
        - heading "Satu aplikasi untuk seluruh operasional." [level=2] [ref=f50e60]
        - paragraph [ref=f50e61]: Business Suite menyatukan POS retail & restoran, produk/SKU master, inventori pusat, multi-cabang, transfer, KDS, reporting, dan finance dalam satu aplikasi berbasis web. Setiap transaksi langsung memengaruhi stok dan laporan.
        - paragraph [ref=f50e62]:
          - text: Akses langsung di
          - link /bisnis/ [ref=f50e63] [cursor=pointer]:
            - /url: /bisnis/
          - text: ". Modul tersedia: Dashboard, POS, Orders, Products, Inventory, Transfers, Restaurant, Kitchen, Reports, Integrasi."
      - generic [ref=f50e64]:
        - generic [ref=f50e65]: Retail POS
        - heading "Kasir toko dengan stok terhubung." [level=2] [ref=f50e66]
        - paragraph [ref=f50e67]: POS retail mendukung pencarian produk, scan barcode, cart, qty, diskon, tender tunai/QRIS/kartu/transfer, receipt, dan sale history. Setiap penjualan mengurangi stok cabang dan mencatat COGS ke finance.
        - paragraph [ref=f50e68]: "Fitur utama: barcode keyboard-wedge, alias barcode, retur, void, shift, multi-register, multi-cabang, dan mode offline dengan sinkronisasi idempoten."
      - generic [ref=f50e69]:
        - generic [ref=f50e70]: Restaurant
        - heading "POS restoran berbasis resep." [level=2] [ref=f50e71]
        - paragraph [ref=f50e72]: Restaurant POS mendukung dine-in dan takeaway, pemilihan meja, guest count, order line, notes, dan pembayaran. Setiap order restoran tersambung ke resep/BOM sehingga ingredient inventory berkurang secara otomatis.
        - paragraph [ref=f50e73]: Laporan restoran mencakup food sales, beverage sales, COGS, gross profit, dan gross margin per kategori serta kanal.
      - generic [ref=f50e74]:
        - generic [ref=f50e75]: Inventory
        - heading "Stok pusat location-aware." [level=2] [ref=f50e76]
        - paragraph [ref=f50e77]: "Inventory menggunakan terminologi operasional: Stok Fisik, Dipesan/Reserved, Dalam Perjalanan/In Transit, dan Stok Tersedia. Setiap cabang dan gudang adalah lokasi tersendiri dengan saldo independen."
        - paragraph [ref=f50e78]: "Fitur: produk/SKU master, low-stock alert, opname, waste/spoilage, transfer antar cabang, dan konservasi stok."
      - generic [ref=f50e79]:
        - generic [ref=f50e80]: Transfer
        - heading "Transfer stok antar cabang." [level=2] [ref=f50e81]
        - paragraph [ref=f50e82]: "Transfer memiliki lifecycle yang jelas: Dibuat → Disetujui → Dikirim → Dalam Perjalanan → Diterima. Status dan qty setiap item terlihat sehingga stok tidak hilang di tengah jalan."
      - generic [ref=f50e83]:
        - generic [ref=f50e84]: KDS / KOT
        - heading "Kitchen Display System." [level=2] [ref=f50e85]
        - paragraph [ref=f50e86]: "KDS menampilkan Kitchen Order Ticket dalam lane: Baru, Diproses, Siap, Selesai. Desain dioptimalkan untuk terbaca dari jarak di dapur. Setiap perubahan status memperbarui prioritas antrean dan waktu elapsed."
      - generic [ref=f50e87]:
        - generic [ref=f50e88]: Reporting
        - heading "Laporan bisnis real-time." [level=2] [ref=f50e89]
        - paragraph [ref=f50e90]: "Reports menyediakan KPI card dan tabel berdasarkan data operasional: penjualan retail, restaurant, food/beverage, COGS, gross profit, gross margin, channel, waste, dan perbandingan cabang. Tidak ada data palsu; angka berasal dari transaksi tercatat."
      - generic [ref=f50e91]:
