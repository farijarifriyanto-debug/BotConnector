        - heading "Webhook dan HTTP/API." [level=2] [ref=f50e148]
        - paragraph [ref=f50e149]: Webhook menerima event JSON melalui HTTPS. HTTP/API digunakan untuk meneruskan hasil workflow ke endpoint tujuan. Semua komunikasi menggunakan HTTPS, retry otomatis, idempotency, dan credential disimpan server-side.
