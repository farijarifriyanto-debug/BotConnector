        - heading "Hubungkan channel dan perangkat." [level=2] [ref=f50e93]
        - paragraph [ref=f50e94]: "Integrasi dikelompokkan berdasarkan jenis dan status ketersediaan. Status ditampilkan secara jujur: Tersedia, Beta, Segera Hadir, atau Roadmap."
