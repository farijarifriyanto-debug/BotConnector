        - generic [ref=f50e38]: BotConnector Documentation
        - heading "Dokumentasi produk & integrasi." [level=1] [ref=f50e39]
        - paragraph [ref=f50e40]: Panduan untuk menjalankan Business Suite — Retail POS, Restaurant, Inventory, Multi-Cabang, Transfer, KDS, Reporting — serta integrasi lokal dan otomasi event-driven.
        - generic [ref=f50e41]:
          - link "01 Buka Business Suite Dashboard, POS, order, produk, stok, transfer, KDS, dan laporan." [ref=f50e42] [cursor=pointer]:
            - /url: /bisnis/
            - generic [ref=f50e43]: "01"
            - strong [ref=f50e44]: Buka Business Suite
            - paragraph [ref=f50e45]: Dashboard, POS, order, produk, stok, transfer, KDS, dan laporan.
          - link "02 Mulai dengan Retail POS Kasir, barcode, cart, tender, receipt, retur, dan offline." [ref=f50e46] [cursor=pointer]:
            - /url: "#retail"
            - generic [ref=f50e47]: "02"
            - strong [ref=f50e48]: Mulai dengan Retail POS
            - paragraph [ref=f50e49]: Kasir, barcode, cart, tender, receipt, retur, dan offline.
          - link "03 Jalankan Restaurant Menu, resep/BOM, KDS/KOT, dine-in/takeaway, QR self-order." [ref=f50e50] [cursor=pointer]:
            - /url: "#restaurant"
            - generic [ref=f50e51]: "03"
            - strong [ref=f50e52]: Jalankan Restaurant
            - paragraph [ref=f50e53]: Menu, resep/BOM, KDS/KOT, dine-in/takeaway, QR self-order.
          - link "04 Hubungkan sistem CSV, barcode, QR, marketplace, food delivery, webhook/API." [ref=f50e54] [cursor=pointer]:
            - /url: "#integrations"
