        - heading "Impor/ekspor dan scan langsung." [level=2] [ref=f50e144]
        - paragraph [ref=f50e145]: CSV/XLSX mendukung impor produk, stok, dan penjualan dengan mapping kolom, dry-run, dan deteksi duplikat. Barcode scanner keyboard-wedge langsung mencari SKU tanpa konfigurasi tambahan.
